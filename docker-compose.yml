services:
  slim-router:
    build:
      context: .
      dockerfile: Dockerfile
    image: slim-router:latest
    container_name: slim-router
    restart: unless-stopped
    # Bind strictly to loopback so reverse proxy (Nginx/Caddy/Traefik) or VPN handles TLS
    ports:
      - "127.0.0.1:20128:20128"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: Asia/Jakarta
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      DATA_DIR: /app/data
      HOME: /tmp
    volumes:
      - slim-router-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  slim-router-data:
    name: slim-router-data
